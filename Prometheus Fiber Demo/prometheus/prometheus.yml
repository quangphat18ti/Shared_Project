global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ============= Prometheus Self-Monitoring =============
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # ============= Fiber Apps =============
  - job_name: fiber-apps
    metrics_path: /metrics
    static_configs:
      - targets:
          - app1:8080
        labels:
          app: app1
      - targets:
          - app2:8080
        labels:
          app: app2
      - targets:
          - app3:8080
        labels:
          app: app3

  # ============= Kafka Metrics (via JMX Exporter) =============
  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:5556
        labels:
          service: kafka
          broker: kafka-broker-1

  # ============= MongoDB Metrics =============
  - job_name: mongodb
    static_configs:
      - targets:
          - mongodb-exporter:9216
        labels:
          service: mongodb
          database: metrics_db

  # ============= MinIO Metrics =============
  - job_name: minio
    bearer_token: minioadmin
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets:
          - minio:9000
        labels:
          service: minio
          instance: minio-primary
