global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: "local-dev"
    env: "development"

rule_files:
  - "alerts.yml"

scrape_configs:
  # ============================================================
  # PROMETHEUS SELF-MONITORING
  # ============================================================
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ============================================================
  # KAFKA - Consumer Lag & Broker Metrics
  # kafka-exporter exposes: kafka_consumergroup_lag,
  # kafka_topic_partition_current_offset, etc.
  # ============================================================
  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "kafka_(.*)"
        target_label: service
        replacement: "kafka"

  # ============================================================
  # KAFKA JMX - CPU, Heap Memory, Network via JMX
  # ============================================================
  - job_name: "kafka-jmx"
    static_configs:
      - targets: ["kafka-jmx-exporter:5556"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "jvm_(.*)"
        target_label: service
        replacement: "kafka"

  # ============================================================
  # MONGODB - ops/sec, latency, connections
  # ============================================================
  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "mongodb_(.*)"
        target_label: service
        replacement: "mongodb"

  # ============================================================
  # MINIO - storage, request rate, S3 ops
  # MinIO exposes /minio/v2/metrics/cluster natively
  # ============================================================
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "minio_(.*)"
        target_label: service
        replacement: "minio"

  # ============================================================
  # NODE EXPORTER - Host CPU, RAM, Disk, Network
  # ============================================================
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ============================================================
  # CADVISOR - Per-Container CPU, RAM, Network
  # Use container_name label to filter by service
  # ============================================================
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only relevant container names
      - source_labels: [container_label_com_docker_compose_service]
        regex: "kafka|mongodb|minio|zookeeper"
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
