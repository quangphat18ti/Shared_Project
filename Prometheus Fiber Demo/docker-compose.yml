version: '3.8'

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  kafka_data:
  zookeeper_data:
  mongo_data:
  minio_data:

services:
  # ============================================================
  # ZOOKEEPER (required by Kafka)
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    networks: [monitoring]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  # ============================================================
  # KAFKA
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    networks: [monitoring]
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Enable JMX for metrics
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ============================================================
  # KAFKA EXPORTER (consumer lag + broker metrics)
  # ============================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    networks: [monitoring]
    depends_on: [kafka]
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'
      - '--kafka.version=3.5.0'
      - '--web.listen-address=:9308'
      - '--topic.filter=.*'
      - '--group.filter=.*'
    restart: unless-stopped

  # ============================================================
  # KAFKA JMX EXPORTER (cpu, memory, network via JMX)
  # ============================================================
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: kafka-jmx-exporter
    networks: [monitoring]
    depends_on: [kafka]
    ports:
      - "5556:5556"
    volumes:
      - ./config/jmx/jmx-kafka-broker.yml:/opt/bitnami/jmx-exporter/example_configs/config.yml
    command: ["5556", "/opt/bitnami/jmx-exporter/example_configs/config.yml"]
    restart: unless-stopped

  # ============================================================
  # MONGODB
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    networks: [monitoring]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: appdb
    volumes:
      - mongo_data:/data/db
      - ./config/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    command: ["mongod", "--setParameter", "diagnosticDataCollectionEnabled=true"]

  # ============================================================
  # MONGODB EXPORTER
  # ============================================================
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter
    networks: [monitoring]
    depends_on: [mongodb]
    ports:
      - "9216:9216"
    command:
      - '--mongodb.uri=mongodb://mongoexporter:exporterpassword@mongodb:27017/admin'
      - '--collect-all'
      - '--compatible-mode'
      - '--discovering-mode'
    restart: unless-stopped

  # ============================================================
  # MINIO
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    networks: [monitoring]
    ports:
      - "9000:9000"
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_PROMETHEUS_AUTH_TYPE: public   # Allow Prometheus scrape without auth
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================
  # NODE EXPORTER (host CPU, RAM, Network for all services)
  # ============================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks: [monitoring]
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    restart: unless-stopped

  # ============================================================
  # CADVISOR (container-level CPU, RAM, Network per container)
  # ============================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    networks: [monitoring]
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

  # ============================================================
  # PROMETHEUS
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - kafka-exporter
      - mongodb-exporter
      - minio
      - node-exporter
      - cadvisor
    restart: unless-stopped

  # ============================================================
  # GRAFANA (optional - for visualization)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks: [monitoring]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on: [prometheus]
    restart: unless-stopped